<!DOCTYPE html>
<html lang="hi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ऑडियो खाताबुक</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <div class="container">
    <header>
      <h1>🎙️ ऑडियो खाताबुक</h1>
      <p>बोलकर या टाइप करके उधारी / जमा दर्ज करें</p>
    </header>

    <!-- डैशबोर्ड समरी कार्ड्स -->
    <div class="summary-cards">
      <div class="card in">
        <h3>कुल लेना है (जमा)</h3>
        <p id="totalIn">₹0</p>
      </div>
      <div class="card out">
        <h3>कुल देना है (उधार)</h3>
        <p id="totalOut">₹0</p>
      </div>
      <div class="card balance">
        <h3>शुद्ध बैलेंस</h3>
        <p id="netBalance">₹0</p>
      </div>
    </div>

    <!-- वॉयस कंट्रोल सेक्शन -->
    <div class="voice-section">
      <button id="micBtn" class="mic-btn">
        <span class="mic-icon">🎤</span>
        <span id="micText">माइक चालू करें और बोलें</span>
      </button>
      <div class="voice-help">
        <strong>बोलने का उदाहरण:</strong> 
        <span>"रमेश से 500 मिले"</span> या <span>"सुरेश को 200 दिए"</span>
      </div>
      <p id="liveTranscript" class="transcript-box">जो आप बोलेंगे यहाँ दिखेगा...</p>
    </div>

    <!-- मैन्युअल एंट्री फॉर्म -->
    <div class="manual-section">
      <h3>मैन्युअल एंट्री (टाइप करें)</h3>
      <form id="ledgerForm">
        <div class="form-group">
          <input type="text" id="custName" placeholder="ग्राहक का नाम" required>
        </div>
        <div class="form-group">
          <input type="number" id="amount" placeholder="राशि (₹)" required>
        </div>
        <div class="form-group">
          <select id="transType">
            <option value="IN">मिला / जमा (IN)</option>
            <option value="OUT">दिया / उधार (OUT)</option>
          </select>
        </div>
        <button type="submit" class="submit-btn">खाते में जोड़ें</button>
      </form>
    </div>

    <!-- लेन-देन सूची -->
    <div class="list-section">
      <div class="list-header">
        <h3>लेन-देन का इतिहास</h3>
        <button id="clearAllBtn" class="clear-btn">सारा डेटा साफ़ करें</button>
      </div>
      <div class="table-responsive">
        <table>
          <thead>
            <tr>
              <th>तारीख व समय</th>
              <th>नाम</th>
              <th>प्रकार</th>
              <th>राशि</th>
              <th>हटाएं</th>
            </tr>
          </thead>
          <tbody id="ledgerTableBody">
            <!-- डायनामिक डेटा यहाँ आएगा -->
          </tbody>
        </table>
      </div>
    </div>
  </div>

  <script src="script.js"></script>
</body>
</html>
